[package]
name = "phase2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "phase2"
path = "src/main.rs"

[dependencies]
lambda_runtime = "0.13"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros"] }
