name: Run Benchmark

# Manually triggered only — no cron (design doc §8).
on:
  workflow_dispatch:
    inputs:
      o2_endpoint:
        description: "OpenObserve OTLP endpoint for Phase 2 (e.g. http://1.2.3.4:4317)"
        required: false
        default: ""

permissions:
  id-token: write   # required for OIDC
  contents: write   # required to commit docs/data/ back to the repo

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # Bucket created by one-time local CDK deploy.
      RESULTS_BUCKET: adot-benchmark-results-645263568766
      O2_ENDPOINT: ${{ github.event.inputs.o2_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_HARNESS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 21600   # 6 hours — Phase 1 takes ~4 hours

      # ── Publish Python SnapStart versions (idempotent) ─────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt

      - name: Publish SnapStart versions
        run: python scripts/publish_snapstart.py

      # ── Run harness ─────────────────────────────────────────────────────────
      - name: Run Phase 1 harness
        run: python harness/run.py --phase 1
        env:
          RESULTS_BUCKET: ${{ env.RESULTS_BUCKET }}

      - name: Run Phase 2 harness
        if: ${{ env.O2_ENDPOINT != '' }}
        run: python harness/run.py --phase 2
        env:
          RESULTS_BUCKET: ${{ env.RESULTS_BUCKET }}
          O2_ENDPOINT: ${{ env.O2_ENDPOINT }}

      # ── Commit results back to the repo ────────────────────────────────────
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "benchmark: add run results $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
